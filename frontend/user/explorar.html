<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSporty - Explorar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #000000; color: white; -webkit-user-select: none; user-select: none; }
        .active-link { color: #00bf63; border-right: 4px solid #00bf63; }
    </style>
</head>
<body class="min-h-screen relative flex bg-black">

    <aside class="hidden md:flex flex-col w-64 h-screen fixed left-0 top-0 bg-[#111814] border-r border-white/10 p-6 z-50">
        <div class="mb-10 flex justify-center w-full">
            <img src="../assets/img/sportyLogotipo.png" alt="Sporty" class="w-32">
        </div>
        <nav class="space-y-4">
            <a href="inicio.html" class="flex items-center gap-4 text-gray-400 hover:text-white group text-sm font-bold">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                <span>Inicio</span>
            </a>
            <a href="explorar.html" class="flex items-center gap-4 text-[#00bf63] hover:text-white group text-sm font-bold">
                <svg class="h-6 w-6 text-[#00bf63]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <span>Explorar</span>
            </a>
            <a href="mapa.html" class="flex items-center gap-4 text-gray-400 hover:text-white group text-sm font-bold">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
                <span>Mapa</span>
            </a>
            <button onclick="abrirModalPublicar()" class="w-full flex items-center gap-4 text-gray-400 hover:text-[#00bf63] group text-sm font-bold transition-colors">
                <span class="h-6 w-6 flex items-center justify-center rounded-lg border-2 border-current">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
                </span>
                <span>Publicar</span>
            </button>
            <a id="navMensajesLink" href="mensajes.html" class="flex items-center gap-4 text-gray-400 hover:text-white group text-sm font-bold">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
                <span>Mensajes</span>
            </a>
            <a id="navNotifLink" href="notificaciones.html" class="flex items-center gap-4 text-gray-400 hover:text-white group text-sm font-bold">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6 6 0 10-12 0v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
                <span>Notificaciones</span>
            </a>
            <a href="perfil.html" class="flex items-center gap-4 text-gray-400 hover:text-white group text-sm font-bold">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/></svg>
                <span>Perfil</span>
            </a>
        </nav>
        
        <div class="mt-auto relative border-t border-gray-800 pt-6">
            <div id="userMenu" class="hidden absolute bottom-full left-0 w-full mb-2 bg-[#181818] border border-white/10 rounded-2xl shadow-2xl overflow-hidden z-50">
                <a href="../auth/login.html" class="block px-4 py-4 text-[10px] font-black text-gray-300 hover:bg-white/5 hover:text-white transition uppercase tracking-widest text-center">Cambiar cuenta</a>
                <div class="border-t border-white/5"></div>
                <a href="../auth/login.html" class="block px-4 py-4 text-[10px] font-black text-red-500 hover:bg-red-500/10 transition uppercase tracking-widest text-center">Cerrar Sesion</a>
            </div>

            <button onclick="toggleUserMenu(event)" class="w-full flex items-center justify-between p-3 -mx-3 rounded-2xl hover:bg-white/5 transition-colors group cursor-pointer">
                <div class="flex items-center gap-3 overflow-hidden">
                    <div class="w-10 h-10 rounded-full bg-[#111814] border border-[#00bf63] flex items-center justify-center shrink-0 overflow-hidden">
                        <img id="foto_user_aside" src="" alt="" class="w-full h-full object-cover">
                    </div>
                    <div class="flex flex-col text-left truncate">
                        <span id="nombre_user_aside" class="text-sm font-black text-white truncate group-hover:text-[#00bf63] transition-colors"></span>
                        <span id="username_user_aside" class="text-[10px] text-gray-500 font-bold uppercase tracking-widest truncate"></span>
                    </div>
                </div>
            </button>
        </div>
    </aside>

    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-[#111814]/95 backdrop-blur-md border-t border-white/5 z-50 px-6 py-3">
        <div class="flex items-center justify-between max-w-md mx-auto">
            <a href="inicio.html" class="text-gray-400 hover:text-white transition"><svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg></a>
            <a href="explorar.html" class="text-[#00bf63]"><svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg></a>
            <button onclick="abrirModalPublicar()" class="flex items-center justify-center w-9 h-9 rounded-xl bg-[#00bf63] text-black active:scale-90 transition-transform focus:outline-none">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
            </button>
            <a id="navMensajesMobile" href="mensajes.html" class="text-gray-400 hover:text-white transition"><svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg></a>
            <a id="navNotifMobile" href="notificaciones.html" class="text-gray-400 hover:text-white transition"><svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6 6 0 10-12 0v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg></a>
            <a href="perfil.html" class="focus:outline-none active:scale-90 transition-transform">
                <img id="foto_user_mobile_nav" src="" alt="" class="w-8 h-8 rounded-full border border-gray-600 bg-gray-800 flex items-center justify-center object-cover">
            </a>
        </div>
    </nav>

    <main class="md:ml-64 flex-grow p-6 md:p-12 pb-24 md:pb-12 w-full">
        <div class="max-w-5xl mx-auto w-full">

            <!-- Buscador -->
            <div class="mb-8 relative">
                <div class="relative">
                    <span class="absolute left-5 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    </span>
                    <input id="input_buscar" type="text" autocomplete="off"
                        placeholder="Buscar atletas, entrenadores..."
                        class="w-full bg-[#111814] border border-white/10 rounded-2xl pl-14 pr-5 py-4 focus:border-[#00bf63] outline-none font-bold italic tracking-wide text-white transition-all text-sm">
                    <button id="btn_limpiar_busqueda" class="hidden absolute right-5 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white transition">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
                <!-- Dropdown de resultados de bÃºsqueda -->
                <div id="dropdown_busqueda" class="hidden absolute top-full left-0 right-0 mt-2 bg-[#111814] border border-white/10 rounded-2xl shadow-2xl overflow-hidden z-50 max-h-[400px] overflow-y-auto"></div>
            </div>

            <!-- Contenido principal (se oculta al buscar) -->
            <div id="contenido_explorar">

                <!-- Categorias / Deportes -->
                <div class="mb-4 flex items-center justify-between">
                    <h2 class="text-[10px] font-black uppercase text-gray-500 tracking-[0.4em] italic">Categorias</h2>
                    <button id="btn_ver_todas" class="hidden text-[10px] font-black text-[#00bf63] uppercase tracking-widest hover:text-white transition">Ver todas</button>
                </div>
                <div id="grid_categorias" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 mb-12"></div>

                <!-- Sugerencias -->
                <div class="mb-4 flex items-center justify-between">
                    <h2 class="text-[10px] font-black uppercase text-gray-500 tracking-[0.4em] italic">Sugerencias para ti</h2>
                </div>
                <div id="grid_sugerencias" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4"></div>

            </div>

            <!-- Vista de deporte filtrado -->
            <div id="vista_deporte" class="hidden">
                <div class="flex items-center gap-3 mb-8">
                    <button id="btn_volver_explorar" class="flex items-center justify-center w-10 h-10 bg-[#111814] border border-white/10 rounded-full text-gray-400 hover:text-[#00bf63] hover:border-[#00bf63] transition-all">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
                    </button>
                    <h2 id="titulo_deporte" class="text-2xl font-black italic uppercase"></h2>
                </div>
                <div id="grid_deporte" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4"></div>
                <p id="deporte_vacio" class="hidden text-center text-gray-500 py-16 font-bold italic">No hay atletas en esta categoria aun.</p>
            </div>

        </div>
    </main>

    <script src="../assets/js/user/explorar.js"></script>
    <script src="../assets/js/user/nav-badge.js"></script>
    <!-- Modal Publicar -->
    <div id="modalPublicar" class="hidden fixed inset-0 z-[100] flex items-end md:items-center justify-center">
        <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" onclick="cerrarModalPublicar()"></div>
        <div class="relative bg-[#111814] border border-white/10 rounded-t-3xl md:rounded-3xl w-full md:max-w-md p-6 shadow-2xl">
            <div id="modalPaso1">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-base font-black uppercase tracking-widest text-white">¿Que quieres publicar?</h2>
                    <button onclick="cerrarModalPublicar()" class="text-gray-500 hover:text-white transition"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="elegirTipo('post')" class="flex flex-col items-center justify-center gap-3 p-6 bg-[#1a1a1a] border border-white/10 rounded-2xl hover:border-[#00bf63] hover:bg-[#00bf63]/5 transition-all group">
                        <svg class="h-8 w-8 text-gray-400 group-hover:text-[#00bf63] transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        <span class="text-xs font-black uppercase tracking-widest text-gray-400 group-hover:text-[#00bf63] transition-colors">Post</span>
                    </button>
                    <button onclick="elegirTipo('historia')" class="flex flex-col items-center justify-center gap-3 p-6 bg-[#1a1a1a] border border-white/10 rounded-2xl hover:border-[#00bf63] hover:bg-[#00bf63]/5 transition-all group">
                        <svg class="h-8 w-8 text-gray-400 group-hover:text-[#00bf63] transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.069A1 1 0 0121 8.82v6.36a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/></svg>
                        <span class="text-xs font-black uppercase tracking-widest text-gray-400 group-hover:text-[#00bf63] transition-colors">Historia</span>
                    </button>
                </div>
            </div>
            <div id="modalPaso2" class="hidden">
                <div class="flex items-center gap-3 mb-6">
                    <button onclick="volverPaso1()" class="text-gray-500 hover:text-white transition"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg></button>
                    <h2 id="modalTitulo" class="text-base font-black uppercase tracking-widest text-white">Nuevo Post</h2>
                    <button onclick="cerrarModalPublicar()" class="ml-auto text-gray-500 hover:text-white transition"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
                </div>
                <label for="inputImagen" class="block mb-4 cursor-pointer">
                    <div id="zonaImagen" class="w-full h-40 rounded-2xl border-2 border-dashed border-white/20 flex flex-col items-center justify-center gap-2 text-gray-500 hover:border-[#00bf63]/50 hover:text-[#00bf63]/70 transition-all overflow-hidden">
                        <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                        <span class="text-xs font-bold uppercase tracking-widest">Elige o arrastra una imagen</span>
                    </div>
                    <input id="inputImagen" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime" class="hidden" onchange="previsualizarImagen(event)">
                </label>
                <textarea id="captionPost" rows="3" placeholder="Escribe un pie de foto..." class="w-full bg-[#1a1a1a] border border-white/10 rounded-2xl px-4 py-3 text-sm text-white placeholder-gray-600 resize-none outline-none focus:border-[#00bf63]/50 transition-all font-medium mb-4"></textarea>
                <button id="btnEnviarPublicacion" onclick="enviarPublicacion()" class="w-full py-3 rounded-2xl bg-[#00bf63] text-black text-sm font-black uppercase tracking-widest hover:bg-[#00e070] transition-colors">Publicar</button>
                <p id="errorPublicar" class="hidden text-xs text-red-400 font-bold text-center mt-3"></p>
            </div>
        </div>
    </div>

</body>
</html>
