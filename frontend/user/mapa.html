    <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAgZdcfmimzAlR31SvAozhtnB8QSg5sboc&libraries=places,geometry&callback=initMap&loading=async"

    <script>
        let mapa;
        let servicioPlaces;
        let infowindow;
        let miUbicacionActual = null;

        function initMap() {
            // 1. Coordenadas de Medac Nova (Málaga) por si falla el GPS
            const medacNova = { lat: 36.6931, lng: -4.4560 };

            // 2. Estilos para que el mapa quede negro y limpio
            const estilosPersonalizados = [
                { "featureType": "poi", "stylers": [{ "visibility": "off" }] },
                { "featureType": "transit", "stylers": [{ "visibility": "off" }] }
            ];

            // 3. Creamos el mapa centrado en Medac Nova por defecto
            mapa = new google.maps.Map(document.getElementById("mapa-google"), {
                center: medacNova,
                zoom: 14,
                styles: estilosPersonalizados,
                disableDefaultUI: true
            });

            // 4. Lógica de Geolocalización (GPS)
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const ubicacionUsuario = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };

                        miUbicacionActual = ubicacionUsuario;
                        mapa.setCenter(ubicacionUsuario);

                        new google.maps.Marker({
                            position: ubicacionUsuario,
                            map: mapa,
                            icon: 'http://maps.google.com/mapfiles/ms/icons/blue-dot.png',
                            title: 'Tu ubicación'
                        });

                        buscarGimnasios(ubicacionUsuario);
                    },
                    () => {
                        console.log("GPS Denegado. Usando Medac Nova como ubicación por defecto.");
                        buscarGimnasios(medacNova);
                    }
                );
            } else {
                buscarGimnasios(medacNova);
            }

            // 5. Ocultar la tarjeta al hacer clic en el mapa vacío
            mapa.addListener("click", () => {
                const tarjeta = document.getElementById('tarjeta-gimnasio');
                if (tarjeta) tarjeta.classList.add('hidden');
            });
        }

        function buscarGimnasios(ubicacion) {
            const request = {
                location: ubicacion,
                radius: 5000,
                type: "gym",
                keyword: "gimnasio"
            };

            servicioPlaces = new google.maps.places.PlacesService(mapa);

            servicioPlaces.nearbySearch(request, (results, status) => {
                if (status === google.maps.places.PlacesServiceStatus.OK && results) {
                    results.forEach((place) => {
                        crearMarcador(place);
                    });
                }
            });
        }

        function crearMarcador(place) {
            const marker = new google.maps.Marker({
                map: mapa,
                position: place.geometry.location,
                title: place.name
            });

            google.maps.event.addListener(marker, "click", () => {
                // 1. Nombre y Dirección
                document.getElementById('gym-nombre').innerText = place.name;
                document.getElementById('gym-direccion').innerText = place.vicinity ? place.vicinity.split(',')[0] : "Dirección desconocida";

                // 2. Abierto / Cerrado
                const tagEstado = document.getElementById('gym-estado');
                let textoEstado = "ABIERTO";
                let claseCSS = "bg-green-500/20 text-[#00bf63] border border-[#00bf63]/30";

                if (place.business_status === 'CLOSED_PERMANENTLY' || place.business_status === 'CLOSED_TEMPORARILY') {
                    textoEstado = "CERRADO";
                    claseCSS = "bg-red-500/20 text-red-400 border border-red-500/30";
                } else if (place.opening_hours) {
                    const abiertoAhora = typeof place.opening_hours.isOpen === 'function'
                        ? place.opening_hours.isOpen()
                        : place.opening_hours.open_now;

                    if (abiertoAhora === false) {
                        textoEstado = "CERRADO";
                        claseCSS = "bg-red-500/20 text-red-400 border border-red-500/30";
                    }
                }

                tagEstado.innerText = textoEstado;
                tagEstado.className = `text-[8px] font-black uppercase px-1.5 py-0.5 rounded ${claseCSS}`;
                
                // 3. Foto de Google
                const imgFoto = document.getElementById('gym-foto');
                if (place.photos && place.photos.length > 0) {
                    imgFoto.src = place.photos[0].getUrl({ maxWidth: 200, maxHeight: 200 });
                } else {
                    imgFoto.src = "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=200&q=80";
                }

                // 4. Calcular Distancia en Kilómetros
                if (miUbicacionActual) {
                    const metros = google.maps.geometry.spherical.computeDistanceBetween(
                        new google.maps.LatLng(miUbicacionActual.lat, miUbicacionActual.lng),
                        place.geometry.location
                    );
                    const km = (metros / 1000).toFixed(1);
                    document.getElementById('gym-distancia').innerText = km + " km";
                } else {
                    document.getElementById('gym-distancia').innerText = "- km";
                }

                // 5. Botón de Ver Perfil del Sitio (Abre pestaña nueva)
                document.getElementById('btn-ver-web').onclick = () => {
                    const urlGoogleMaps = "https://www.google.com/maps/place/?q=place_id:" + place.place_id;
                    window.open(urlGoogleMaps, "_blank");
                };

                // 6. LLAMADA AL BACKEND: Buscar amigos y comprobar si seguimos el gym
                const contenedorAmigos = document.getElementById('contenedor-amigos');
                const textoAmigos = document.getElementById('texto-amigos');
                const btnSeguir = document.getElementById('btn-seguir');
                
                // 6.1 ESTADO DE CARGA Y RESET (Mata el efecto fantasma)
                contenedorAmigos.innerHTML = '<div class="w-6 h-6 rounded-full border-2 border-[#141b17] bg-gray-800 animate-pulse"></div>';
                textoAmigos.innerText = "Buscando datos...";
                textoAmigos.className = "text-[10px] text-gray-500 font-bold";
                
                // Desactivamos el botón en gris mientras esperamos a la base de datos
                btnSeguir.className = "w-14 bg-gray-800 rounded-xl flex items-center justify-center text-gray-600 pointer-events-none transition-colors";
                btnSeguir.onclick = null; // Borramos clics anteriores

                fetch(`../../backend/public/api/auth/mapa.php?place_id=${place.place_id}`)
                    .then(response => response.json())
                    .then(data => {
                        contenedorAmigos.innerHTML = ''; 
                        
                        if (data.error) {
                            textoAmigos.innerText = "Error al cargar datos";
                            return;
                        }

                        // --- LÓGICA DE AMIGOS (Se queda igual) ---
                        // ... dentro del fetch donde pintamos los amigos ...

                        if (data.total > 0) {
                            let htmlFotos = '';
                            const maxMostrar = Math.min(data.total, 3);
                            for (let i = 0; i < maxMostrar; i++) {
                                const amigo = data.amigos[i];
                                const fotoSrc = amigo.foto_perfil ? amigo.foto_perfil : `https://ui-avatars.com/api/?name=${amigo.nickname}&background=111814&color=00bf63`;
                                htmlFotos += `<img class="w-6 h-6 rounded-full border-2 border-[#141b17] object-cover relative z-${30-(i*10)}" src="${fotoSrc}">`;
                            }
                            if (data.total > 3) htmlFotos += `<div class="w-6 h-6 rounded-full border-2 border-[#141b17] bg-gray-800 flex items-center justify-center text-[8px] font-black text-white relative z-0">+${data.total - 3}</div>`;
                            
                            contenedorAmigos.innerHTML = htmlFotos;
                            // CAMBIADO: "amigo sigue este sitio" en lugar de "activo ahora"
                            textoAmigos.innerText = data.total === 1 ? "1 amigo sigue este sitio" : `${data.total} amigos siguen este sitio`;
                            textoAmigos.className = "text-[10px] text-[#00bf63] font-bold";
                        } else {
                            contenedorAmigos.innerHTML = `<div class="w-6 h-6 rounded-full border-2 border-[#141b17] bg-gray-800 flex items-center justify-center text-gray-600"><svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg></div>`;
                            // CAMBIADO: Texto para cuando no hay seguidores
                            textoAmigos.innerText = "Ningún amigo sigue este sitio";
                            textoAmigos.className = "text-[10px] text-gray-500 font-bold";
                        }

                        // --- 7. LÓGICA DEL BOTÓN SEGUIR (Ya conectada) ---
                        let siguiendo = data.siguiendo; // Viene de PHP (true o false)

                        const pintarBoton = (estado) => {
                            if (estado) {
                                // ESTADO SEGUIDO: Verde, brillante y con el icono RELLENO
                                btnSeguir.className = "w-14 bg-[#00bf63] hover:bg-[#00a855] text-black rounded-xl flex items-center justify-center transition-colors shadow-[0_0_15px_rgba(0,191,99,0.4)] active:scale-95 cursor-pointer pointer-events-auto";
                                btnSeguir.innerHTML = '<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>';
                            } else {
                                // ESTADO NO SEGUIDO: Gris y con el icono VACÍO (solo líneas)
                                btnSeguir.className = "w-14 bg-gray-800 hover:bg-[#00bf63] hover:text-black rounded-xl flex items-center justify-center text-gray-400 transition-colors active:scale-95 cursor-pointer pointer-events-auto";
                                btnSeguir.innerHTML = '<svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>';
                            }
                        };

                        pintarBoton(siguiendo); // Pintamos el estado real al cargar

                        // Qué pasa al hacer clic
                        btnSeguir.onclick = () => {
                            const accion = siguiendo ? 'dejar' : 'seguir';
                            
                            // 1. Actualización Optimista: Lo cambiamos visualmente YA
                            siguiendo = !siguiendo; 
                            pintarBoton(siguiendo);

                            // 2. Le pedimos a PHP que lo guarde
                            fetch('../../backend/public/api/auth/seguir_gimnasio_mapa.php', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ place_id: place.place_id, accion: accion })
                            })
                            .then(r => {
                                // Si PHP devuelve un error grave (como 404 o 500), forzamos el error
                                if(!r.ok) throw new Error("Fallo en el servidor");
                                return r.json();
                            })
                            .then(res => {
                                // Si PHP nos dice success: false, forzamos el error
                                if(!res.success) throw new Error("No se pudo guardar en BD");
                            })
                            .catch(error => {
                                // SALVAVIDAS: Si algo falló, revertimos el botón al color que tenía
                                console.error("Error detectado:", error);
                                siguiendo = !siguiendo; 
                                pintarBoton(siguiendo);
                            });
                        };
                    })
                    .catch(error => {
                        textoAmigos.innerText = "Sin conexión";
                    });

                // 8. Mostrar la tarjeta
                document.getElementById('tarjeta-gimnasio').classList.remove('hidden');
            });
        }
    </script>
</body>

</html>
