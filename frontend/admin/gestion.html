    <main class="md:ml-64 p-6 md:p-12 pb-24 md:pb-12">
        <h1 class="text-3xl font-black mb-10">Gestión de <span class="text-[#00bf63]">Contenidos</span></h1>
    
        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
            <div class="bg-[#111814] p-8 rounded-3xl border border-white/5 shadow-xl overflow-hidden">
                <h3 class="text-xl font-bold mb-6 flex items-center gap-3">
                    <span class="text-[#00bf63]">●</span> Listado de Deportes
                </h3>
                <div class="mb-5">
                    <input id="buscadorDeportes" type="text" placeholder="Buscar deporte..." class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white outline-none focus:border-[#00bf63]">
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="text-[10px] uppercase text-gray-500 font-black tracking-widest border-b border-white/10">
                            <tr>
                                <th class="pb-4">Deporte</th>
                                <th class="pb-4 text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tablaDeportes" class="text-sm">
                            </tbody>
                    </table>
                </div>
            </div>
    
            <div class="bg-[#111814] p-8 rounded-3xl border border-white/5 shadow-xl overflow-hidden">
                <h3 class="text-xl font-bold mb-6 flex items-center gap-3">
                    <span class="text-[#00bf63]">●</span> Listado de Ejercicios
                </h3>
                <div class="mb-5">
                    <input id="buscadorEjercicios" type="text" placeholder="Buscar ejercicio o categoria..." class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white outline-none focus:border-[#00bf63]">
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="text-[10px] uppercase text-gray-500 font-black tracking-widest border-b border-white/10">
                            <tr>
                                <th class="pb-4">Ejercicio</th>
                                <th class="pb-4">Categoría</th>
                                <th class="pb-4 text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tablaEjercicios" class="text-sm">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
