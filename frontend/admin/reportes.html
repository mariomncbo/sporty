    <main class="md:ml-64 p-6 md:p-12 pb-24 md:pb-12">
        <h1 class="text-3xl font-black mb-10">Gestión de <span class="text-red-500">Reportes</span></h1>

        <!-- Filtros -->
        <div class="mb-8 flex flex-col gap-4">
            <div>
                <p class="text-[11px] text-gray-500 font-bold uppercase tracking-widest mb-2">Filtrar por Estado</p>
                <div class="flex flex-wrap gap-2">
                    <button data-valor="todos" onclick="setFiltroEstado('todos')" class="filtro-estado-btn activo px-4 py-1.5 rounded-full text-xs font-bold border border-white/20 transition">Todos</button>
                    <button data-valor="Pendiente" onclick="setFiltroEstado('Pendiente')" class="filtro-estado-btn px-4 py-1.5 rounded-full text-xs font-bold border border-white/20 transition">Pendiente</button>
                    <button data-valor="En Revisión" onclick="setFiltroEstado('En Revisión')" class="filtro-estado-btn px-4 py-1.5 rounded-full text-xs font-bold border border-white/20 transition">En Revisión</button>
                    <button data-valor="Resuelto" onclick="setFiltroEstado('Resuelto')" class="filtro-estado-btn px-4 py-1.5 rounded-full text-xs font-bold border border-white/20 transition">Resuelto</button>
                    <button data-valor="Desestimado" onclick="setFiltroEstado('Desestimado')" class="filtro-estado-btn px-4 py-1.5 rounded-full text-xs font-bold border border-white/20 transition">Desestimado</button>
                </div>
            </div>
            <div>
                <p class="text-[11px] text-gray-500 font-bold uppercase tracking-widest mb-2">Filtrar por Tipo</p>
                <div class="flex flex-wrap gap-2">
                    <button data-valor="todos" onclick="setFiltroTipo('todos')" class="filtro-tipo-btn activo px-4 py-1.5 rounded-full text-xs font-bold border border-white/20 transition">Todos</button>
                    <button data-valor="Error" onclick="setFiltroTipo('Error')" class="filtro-tipo-btn px-4 py-1.5 rounded-full text-xs font-bold border border-white/20 transition">Error</button>
                    <button data-valor="Spam" onclick="setFiltroTipo('Spam')" class="filtro-tipo-btn px-4 py-1.5 rounded-full text-xs font-bold border border-white/20 transition">Spam</button>
                    <button data-valor="Comportamiento" onclick="setFiltroTipo('Comportamiento')" class="filtro-tipo-btn px-4 py-1.5 rounded-full text-xs font-bold border border-white/20 transition">Comportamiento</button>
                    <button data-valor="Otro" onclick="setFiltroTipo('Otro')" class="filtro-tipo-btn px-4 py-1.5 rounded-full text-xs font-bold border border-white/20 transition">Otro</button>
                </div>
            </div>
        </div>

        <div id="contenedorReportes" class="space-y-4">
            <div class="flex justify-center items-center py-10">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-[#00bf63]"></div>
            </div>
        </div>
    </main>

    <div id="modalBaneo"
        class="fixed inset-0 z-[100] hidden flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
        <div class="bg-[#181818] w-full max-w-md rounded-3xl border border-white/10 shadow-2xl overflow-hidden p-8">
            <h3 class="text-xl font-black mb-2 tracking-tight">Configurar Baneo</h3>
            <p class="text-gray-400 text-sm mb-6">Usuario: <span id="usuarioBaneado"
                    class="text-white font-bold">@user</span></p>

            <div class="space-y-6">
                <div>
                    <label class="text-[11px] text-gray-500 font-bold uppercase tracking-widest block mb-2">Tipo de
                        Restricción</label>
                    <select id="tipoBaneo" onchange="toggleTemporal()"
                        class="w-full bg-[#111814] border border-white/10 rounded-xl p-3 text-sm outline-none focus:border-red-500 transition">
                        <option value="permanente">Permanente</option>
                        <option value="temporal">Temporal</option>
                    </select>
                </div>

                <div id="seccionTemporal" class="hidden">
                    <label
                        class="text-[11px] text-gray-500 font-bold uppercase tracking-widest block mb-2">Duración</label>
                    <select id="duracionBaneo"
                        class="w-full bg-[#111814] border border-white/10 rounded-xl p-3 text-sm outline-none focus:border-[#00bf63] transition">
                        <option value="1">24 Horas</option>
                        <option value="3">3 Días</option>
                        <option value="7">1 Semana</option>
                        <option value="30">1 Mes</option>
                    </select>
                </div>
            </div>

            <div class="flex gap-3 mt-10">
                <button onclick="cerrarModal()"
                    class="flex-1 bg-white/5 py-3 rounded-xl font-bold text-xs hover:bg-white/10 transition uppercase tracking-widest">Cancelar</button>
                <button onclick="confirmarBaneo()"
                    class="flex-1 bg-red-600 py-3 rounded-xl font-black text-xs hover:bg-red-700 transition uppercase tracking-widest shadow-lg shadow-red-600/20">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Modal: Cambiar Estado -->
    <div id="modalEstado"
        class="fixed inset-0 z-[100] hidden flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
        <div class="bg-[#181818] w-full max-w-sm rounded-3xl border border-white/10 shadow-2xl overflow-hidden p-8">
            <h3 class="text-xl font-black mb-2 tracking-tight">Cambiar Estado</h3>
            <p class="text-gray-400 text-sm mb-6">Reporte <span id="reporteIdLabel"
                    class="text-white font-bold">#</span></p>

            <div>
                <label class="text-[11px] text-gray-500 font-bold uppercase tracking-widest block mb-2">Nuevo
                    Estado</label>
                <select id="nuevoEstado"
                    class="w-full bg-[#111814] border border-white/10 rounded-xl p-3 text-sm outline-none focus:border-[#00bf63] transition">
                    <option value="Pendiente">Pendiente</option>
                    <option value="En Revisión">En Revisión</option>
                    <option value="Resuelto">Resuelto</option>
                    <option value="Desestimado">Desestimado</option>
                </select>
            </div>

            <div class="flex gap-3 mt-8">
                <button onclick="cerrarModalEstado()"
                    class="flex-1 bg-white/5 py-3 rounded-xl font-bold text-xs hover:bg-white/10 transition uppercase tracking-widest">Cancelar</button>
                <button onclick="confirmarCambioEstado()"
                    class="flex-1 bg-[#00bf63] py-3 rounded-xl font-black text-xs hover:bg-[#00a855] transition uppercase tracking-widest shadow-lg shadow-[#00bf63]/20">Confirmar</button>
            </div>
        </div>
    </div>

</body>

</html>
